name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config \
            libwayland-dev libxkbcommon-dev libegl-dev libdbus-1-dev libexpat1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run backend tests
        run: cargo test --locked -p radio-core -p radio-player -p radio-tasks

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check app and applet
        run: cargo check --workspace --locked

  omarchy-legacy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap iproute2 jq lua5.4 mpv python3 ripgrep socat
          sudo apt-get install --yes qt6-declarative-dev-tools qml6-module-qttest \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtqml-models

      - name: Allow Bubblewrap network namespace setup
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Ubuntu's child profile denies CAP_NET_ADMIN needed to bring loopback up.
          sudo apparmor_parser --remove /etc/apparmor.d/bwrap-userns-restrict

      - name: Run legacy Omarchy tests
        run: ./tests/run
        working-directory: legacy
