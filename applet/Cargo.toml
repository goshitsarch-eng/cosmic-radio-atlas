[package]
name = "cosmic-applet-radio-atlas"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Panel applet for Cosmic Radio Atlas"

[dependencies]
radio-core = { path = "../crates/radio-core" }
radio-player = { path = "../crates/radio-player" }
radio-tasks = { path = "../crates/radio-tasks" }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.11"
tokio = { version = "1.52.0", features = ["full"] }

[build-dependencies]
xdgen = "0.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]

[lints]
workspace = true
