[package]
name = "radio-player"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "mpv-backed radio playback with IPC control for Cosmic Radio Atlas"

[dependencies]
radio-core = { path = "../radio-core" }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

# Process signaling and session setup need three tiny, audited unsafe calls.
[lints.rust]
unsafe_code = "allow"
