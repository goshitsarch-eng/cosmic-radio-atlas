[package]
name = "cosmic-radio-atlas"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Explore live radio on a rotatable globe"

[dependencies]
radio-core = { path = "../crates/radio-core" }
radio-player = { path = "../crates/radio-player" }
radio-tasks = { path = "../crates/radio-tasks" }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["full"] }

[build-dependencies]
xdgen = "0.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    "about",
    "single-instance",
    "wgpu",
]

[lints]
workspace = true
